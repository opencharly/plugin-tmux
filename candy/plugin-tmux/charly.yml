plugin-tmux:
    candy:
        description: |-
            Generic typed terminal and terminal-agent runtime backed by tmux
            control mode. Each run owns an isolated socket; literal input,
            bracketed paste, keys, resize, signals, ordered raw output, snapshots,
            detach/reattach, exit status, and cleanup travel only through the
            CUE-generated Provider.Channel contract. It is placement-neutral and
            therefore works locally, over gRPC/SSH, and in nested deployments.

            Operators and MCP clients use `charly agent terminal`, so terminal
            operations never recursively invoke `charly cmd` or `charly shell`.
        plugin:
            source: github.com/opencharly/plugin-tmux/candy/plugin-tmux
            providers:
                - terminal:tmux
                - agent-runtime:tmux
        plan:
            - check: the compiled provider registry exposes the typed tmux terminal channel
              id: tmux-terminal-provider-present
              context: [runtime]
              command: charly agent runtime status tmux --class terminal
              stdout:
                - contains: '"streaming":true'
            - check: the compiled provider registry exposes tmux as an agent runtime too
              id: tmux-agent-provider-present
              context: [runtime]
              command: charly agent runtime status tmux --class agent-runtime
              stdout:
                - contains: '"streaming":true'

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
tmux-skill:
  skill:
    name: tmux
    family: automation
    owner: plugin-tmux
    triggers:
      - "`charly tmux` sessions / terminal channels / snapshot / transcript / detached-reattach / gRPC terminal"
